<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7ff">
  <title>لغتي | اختبار حفظ الكلمات</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7ff; --surface: rgba(255,255,255,.88); --surface-strong: #fff;
      --text: #17233f; --muted: #73809c; --border: rgba(106,126,170,.2);
      --accent: #5865f2; --accent-hover: #4652db; --accent-soft: rgba(88,101,242,.11);
      --success: #14866d; --danger: #d94d68; --shadow: 0 22px 65px rgba(38,56,105,.12);
      --hint: rgba(88,101,242,.18); --hint-glow: rgba(104,158,255,.85);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1324; --surface: rgba(22,31,53,.9); --surface-strong: #17213a;
      --text: #eef3ff; --muted: #9ba8c7; --border: rgba(160,179,225,.18);
      --accent: #94a0ff; --accent-hover: #b0b8ff; --accent-soft: rgba(148,160,255,.13);
      --success: #61d7b7; --danger: #ff8298; --shadow: 0 22px 65px rgba(0,0,0,.28);
      --hint: rgba(165,190,255,.2); --hint-glow: rgba(137,183,255,.9);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(ellipse at 15% 0%, var(--accent-soft), transparent 38%), var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      transition: background .25s ease, color .25s ease;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(100% - 32px, 900px); margin: auto; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:24px 0; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { display:grid; place-items:center; width:46px; height:46px; border-radius:15px; color:#fff; background:linear-gradient(145deg,#6574ff,#8b5cf6); box-shadow:0 8px 24px rgba(88,101,242,.3); font-size:23px; font-weight:800; }
    .brand-name { margin:0; font-size:23px; letter-spacing:-.5px; }
    .brand-sub { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .settings-wrap { position:relative; }
    .icon-btn { width:46px; height:46px; display:grid; place-items:center; border:1px solid var(--border); border-radius:15px; background:var(--surface); color:var(--text); font-size:21px; transition:transform .2s,border-color .2s; }
    .icon-btn:hover { transform:translateY(-2px); border-color:var(--accent); }
    .dropdown { position:absolute; z-index:10; top:56px; left:0; width:245px; padding:14px; border:1px solid var(--border); border-radius:18px; background:var(--surface-strong); box-shadow:var(--shadow); display:none; }
    .dropdown.open { display:block; animation:pop .15s ease-out; }
    .dropdown-title { margin:2px 5px 10px; color:var(--muted); font-size:12px; font-weight:700; }
    .menu-btn { width:100%; text-align:right; border:0; border-radius:11px; padding:11px 12px; background:transparent; color:var(--text); font-size:14px; }
    .menu-btn:hover, .menu-btn[aria-pressed="true"] { background:var(--accent-soft); }
    .menu-btn.danger { color:var(--danger); }
    .menu-divider { height:1px; background:var(--border); margin:8px 0; }
    main { flex:1; display:grid; place-items:center; padding:28px 0 54px; }
    .panel { width:min(100%,660px); padding:clamp(24px,5vw,48px); background:var(--surface); border:1px solid var(--border); border-radius:30px; box-shadow:var(--shadow); backdrop-filter:blur(16px); text-align:center; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface-strong); border-radius:999px; padding:8px 13px; color:var(--muted); font-size:12px; font-weight:700; }
    .eyebrow-dot { width:7px; height:7px; background:var(--accent); border-radius:50%; box-shadow:0 0 0 4px var(--accent-soft); }
    h2 { font-size:clamp(25px,4vw,34px); margin:22px 0 8px; letter-spacing:-.7px; }
    .subtitle { margin:0 auto; max-width:420px; color:var(--muted); font-size:14px; line-height:1.8; }
    .word-display { direction:ltr; margin:30px 0 10px; font:700 clamp(35px,8vw,54px)/1.3 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; letter-spacing:1px; overflow-wrap:anywhere; }
    .stage-label { color:var(--muted); font-size:13px; margin-bottom:26px; }
    .actions { display:flex; justify-content:center; flex-wrap:wrap; gap:11px; margin-top:26px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:9px; min-height:48px; padding:0 20px; border-radius:14px; border:1px solid var(--border); background:var(--surface-strong); color:var(--text); font-weight:700; font-size:14px; transition:transform .15s,background .15s; }
    .btn:hover { transform:translateY(-2px); }
    .btn-primary { background:var(--accent); color:#fff; border-color:transparent; box-shadow:0 8px 20px rgba(88,101,242,.2); }
    [data-theme="dark"] .btn-primary { color:#11172b; }
    .btn-primary:hover { background:var(--accent-hover); }
    .btn:focus-visible, .icon-btn:focus-visible, input:focus-visible { outline:3px solid var(--hint-glow); outline-offset:3px; }
    .input-stage { display:none; margin-top:30px; }
    .input-stage.visible { display:block; }
    .input-shell { position:relative; width:min(100%,470px); margin:0 auto; direction:ltr; }
    .hint-layer, .answer-input { width:100%; min-height:76px; padding:16px 12px; text-align:center; font:600 clamp(23px,5.5vw,34px)/1.3 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; letter-spacing:0; white-space:pre; }
    .hint-layer { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; overflow:hidden; pointer-events:none; color:var(--hint); text-shadow:0 0 7px var(--hint-glow),0 0 18px var(--hint-glow); border:1px solid transparent; user-select:none; }
    .answer-input { position:relative; display:block; background:transparent; color:var(--text); caret-color:var(--accent); border:1px solid var(--border); border-radius:16px; outline:none; }
    .answer-input::placeholder { color:var(--muted); opacity:.65; font-size:14px; }
    .answer-input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
    .answer-input.has-hint { color:transparent; text-shadow:none; }
    .answer-input.has-hint::selection { background:rgba(100,130,255,.35); }
    .answer-input:focus.has-hint { color:transparent; }
    .feedback { min-height:25px; margin:16px 0 0; font-size:13px; color:var(--muted); }
    .feedback.error { color:var(--danger); }
    .feedback.success { color:var(--success); }
    .progress-head { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:12px; margin:28px 0 10px; }
    .progress-track { width:100%; height:7px; border-radius:99px; background:var(--accent-soft); overflow:hidden; }
    .progress-fill { width:0%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent),#a78bfa); transition:width .3s ease; }
    .step-dots { display:flex; justify-content:center; gap:8px; margin-top:25px; }
    .step-dot { width:9px; height:9px; border-radius:99px; background:var(--border); transition:all .2s; }
    .step-dot.active { width:25px; background:var(--accent); }
    footer { padding:0 0 22px; text-align:center; color:var(--muted); font-size:12px; }
    .shake { animation:shake .32s ease-in-out; border-color:var(--danger)!important; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
    @keyframes pop { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }
    @media(max-width:520px) { .app{width:min(100% - 22px,900px)} .topbar{padding:16px 0} .panel{border-radius:23px;padding:27px 18px} .brand-name{font-size:21px} .actions{flex-direction:column} .actions .btn{width:100%} .dropdown{left:0;right:auto} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important} }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" aria-label="لغتي">
        <div class="brand-mark" aria-hidden="true">ل</div>
        <div><h1 class="brand-name">لغتي</h1><p class="brand-sub">خطوة صغيرة، كلمة جديدة</p></div>
      </div>
      <div class="settings-wrap">
        <button class="icon-btn" id="settingsToggle" type="button" aria-label="الإعدادات" aria-expanded="false" aria-controls="settingsMenu">⚙</button>
        <div class="dropdown" id="settingsMenu" role="menu" aria-label="إعدادات الموقع">
          <p class="dropdown-title">المظهر</p>
          <button class="menu-btn" id="lightTheme" type="button" role="menuitem">☀️ الوضع الفاتح</button>
          <button class="menu-btn" id="darkTheme" type="button" role="menuitem">🌙 الوضع الداكن</button>
          <div class="menu-divider"></div>
          <button class="menu-btn danger" id="clearProgress" type="button" role="menuitem">↺ مسح التقدم والبدء من جديد</button>
        </div>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="panelTitle">
        <div class="eyebrow"><span class="eyebrow-dot"></span><span id="eyebrowText">تدريب المفردات</span></div>
        <h2 id="panelTitle">خلّينا نحفظ كلمة جديدة</h2>
        <p class="subtitle" id="instruction">استمع إلى الكلمة، ثم اكتبها بنفسك. كل مرحلة تساعدك تعتمد على ذاكرتك أكثر.</p>

        <div id="readyStage">
          <div class="word-display" id="wordDisplay" lang="en">vocabulary</div>
          <div class="stage-label" id="wordCounter">الكلمة 1 من 8</div>
          <div class="actions">
            <button class="btn" id="listenBtn" type="button">🔊 استمع للكلمة</button>
            <button class="btn btn-primary" id="startBtn" type="button">ابدأ الاختبار <span aria-hidden="true">←</span></button>
          </div>
        </div>

        <div class="input-stage" id="inputStage">
          <div class="stage-label" id="stageLabel">المرحلة الأولى · تلميح كامل</div>
          <div class="input-shell">
            <div class="hint-layer" id="hintLayer" aria-hidden="true"></div>
            <input class="answer-input has-hint" id="answerInput" type="text" dir="ltr" lang="en" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="اكتب الكلمة باللغة الإنجليزية" placeholder="اكتب الكلمة هنا…" />
          </div>
          <p class="feedback" id="feedback" aria-live="polite">اكتب الكلمة ثم اضغط «تحقق».</p>
          <div class="actions">
            <button class="btn" id="backBtn" type="button">عرض الكلمة</button>
            <button class="btn btn-primary" id="checkBtn" type="button">تحقّق <span aria-hidden="true">✓</span></button>
          </div>
        </div>

        <div class="step-dots" aria-label="مراحل الاختبار">
          <span class="step-dot active" id="dot1"></span><span class="step-dot" id="dot2"></span><span class="step-dot" id="dot3"></span>
        </div>
        <div class="progress-head"><span id="progressText">التقدم في الكلمات</span><span id="progressCount">0%</span></div>
        <div class="progress-track" role="progressbar" id="progressBar" aria-label="التقدم" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
      </section>
    </main>
    <footer>لغتي · تعلّم بالتكرار، وتقدّم بثقة</footer>
  </div>

  <script>
    (() => {
      'use strict';

      // عدّل هذه القائمة لإضافة كلمات المنهج.
      const words = [
        { word: 'vocabulary', meaning: 'المفردات' },
        { word: 'environment', meaning: 'البيئة' },
        { word: 'achievement', meaning: 'إنجاز' },
        { word: 'opportunity', meaning: 'فرصة' },
        { word: 'responsibility', meaning: 'مسؤولية' },
        { word: 'communication', meaning: 'تواصل' },
        { word: 'development', meaning: 'تطوّر' },
        { word: 'knowledge', meaning: 'معرفة' }
      ];

      const PROGRESS_KEY = 'lughati-spelling-progress-v1';
      const THEME_KEY = 'lughati-theme';
      const $ = id => document.getElementById(id);
      const ui = {
        app: $('app'), settingsToggle: $('settingsToggle'), settingsMenu: $('settingsMenu'),
        lightTheme: $('lightTheme'), darkTheme: $('darkTheme'), clearProgress: $('clearProgress'),
        panelTitle: $('panelTitle'), instruction: $('instruction'), eyebrowText: $('eyebrowText'),
        readyStage: $('readyStage'), inputStage: $('inputStage'), wordDisplay: $('wordDisplay'),
        wordCounter: $('wordCounter'), listenBtn: $('listenBtn'), startBtn: $('startBtn'),
        stageLabel: $('stageLabel'), hintLayer: $('hintLayer'), answerInput: $('answerInput'),
        feedback: $('feedback'), checkBtn: $('checkBtn'), backBtn: $('backBtn'),
        progressText: $('progressText'), progressCount: $('progressCount'),
        progressBar: $('progressBar'), progressFill: $('progressFill'),
        dots: [$('dot1'), $('dot2'), $('dot3')]
      };

      function readProgress() {
        try {
          const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY));
          if (saved && saved.completed === true) {
            return { index: 0, stage: 1, started: false, completed: true };
          }
          if (saved && Number.isInteger(saved.index) && saved.index >= 0 &&
              saved.index < words.length && [1, 2, 3].includes(saved.stage)) {
            return { index: saved.index, stage: saved.stage, started: saved.started === true, completed: false };
          }
        } catch (error) { console.warn('تعذرت قراءة التقدم المحفوظ.', error); }
        return { index: 0, stage: 1, started: false, completed: false };
      }

      let state = readProgress();

      function saveProgress() {
        try {
          localStorage.setItem(PROGRESS_KEY, JSON.stringify(state));
        } catch (error) {
          console.warn('تعذر حفظ التقدم على هذا الجهاز.', error);
          showFeedback('تعذّر حفظ التقدم في المتصفح.', 'error');
        }
      }

      function applyTheme(theme) {
        const safeTheme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = safeTheme;
        document.querySelector('meta[name="theme-color"]').content = safeTheme === 'dark' ? '#0d1324' : '#f4f7ff';
        ui.lightTheme.setAttribute('aria-pressed', String(safeTheme === 'light'));
        ui.darkTheme.setAttribute('aria-pressed', String(safeTheme === 'dark'));
        try { localStorage.setItem(THEME_KEY, safeTheme); } catch (error) { /* يعمل المظهر حتى لو كان التخزين معطلاً */ }
      }

      function showFeedback(message, type = '') {
        ui.feedback.textContent = message;
        ui.feedback.className = 'feedback' + (type ? ' ' + type : '');
      }

      function makeHint(word, stage) {
        if (stage === 1) return word;
        if (stage === 3) return '';
        // اختيار نصف الحروف تقريباً بشكل عشوائي مع الحفاظ على أماكن الحروف المخفية.
        const chars = Array.from(word);
        const positions = chars.map((_, i) => i);
        for (let i = positions.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [positions[i], positions[j]] = [positions[j], positions[i]];
        }
        const visibleCount = Math.ceil(chars.length / 2);
        const visible = new Set(positions.slice(0, visibleCount));
        return chars.map((char, i) => visible.has(i) ? char : ' ').join('');
      }

      function updateProgress() {
        const percent = state.completed ? 100 : Math.round((state.index / words.length) * 100);
        ui.progressFill.style.width = percent + '%';
        ui.progressCount.textContent = percent + '%';
        ui.progressBar.setAttribute('aria-valuenow', String(percent));
        ui.progressText.textContent = state.completed
          ? 'اكتملت مجموعة الكلمات (' + words.length + ' كلمات)'
          : 'أنجزت ' + state.index + ' من ' + words.length + ' كلمات';
      }

      function updateDots() {
        ui.dots.forEach((dot, i) => dot.classList.toggle('active', state.completed || i === state.stage - 1));
      }

      function render() {
        const current = words[state.index];
        const isStarted = state.started;
        ui.wordDisplay.textContent = state.completed ? words[0].word : current.word;
        ui.wordCounter.textContent = state.completed
          ? 'اكتملت المجموعة'
          : 'الكلمة ' + (state.index + 1) + ' من ' + words.length;
        ui.readyStage.style.display = isStarted ? 'none' : 'block';
        ui.inputStage.classList.toggle('visible', isStarted);
        ui.panelTitle.textContent = state.completed
          ? 'أحسنت! أنهيت الكلمات كلها 🎉'
          : (isStarted ? 'اكتب الكلمة من ذاكرتك' : 'خلّينا نحفظ كلمة جديدة');
        ui.instruction.textContent = state.completed
          ? 'أنهيت مجموعة الكلمات بنجاح. اضغط «ابدأ الاختبار» لمراجعتها مرة أخرى.'
          : (isStarted
            ? 'ركّز في أماكن الحروف، ثم اكتب الكلمة واضغط «تحقّق».'
            : 'استمع إلى الكلمة، ثم اكتبها بنفسك. كل مرحلة تساعدك تعتمد على ذاكرتك أكثر.');
        ui.eyebrowText.textContent = state.completed ? 'اكتمل الاختبار' : (isStarted ? 'اختبار الإملاء' : 'تدريب المفردات');
        ui.stageLabel.textContent = ['المرحلة الأولى · تلميح كامل', 'المرحلة الثانية · نصف الحروف', 'المرحلة الثالثة · بدون تلميح'][state.stage - 1];
        ui.hintLayer.textContent = isStarted ? makeHint(current.word, state.stage) : '';
        ui.answerInput.classList.toggle('has-hint', isStarted && state.stage < 3);
        ui.answerInput.value = '';
        showFeedback(state.completed
          ? 'تم إكمال جميع الكلمات بنجاح.'
          : (isStarted ? 'اكتب الكلمة ثم اضغط «تحقّق».' : ''));
        updateDots();
        updateProgress();
      }

      function startTest() {
        if (state.completed) {
          state.index = 0;
          state.stage = 1;
          state.completed = false;
        }
        state.started = true;
        saveProgress();
        render();
        ui.answerInput.focus();
      }

      function listenToWord() {
        const word = words[state.index].word;
        if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
          showFeedback('خاصية الاستماع غير مدعومة في هذا المتصفح.', 'error');
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.82;
        window.speechSynthesis.speak(utterance);
      }

      function checkAnswer() {
        const answer = ui.answerInput.value.trim().toLocaleLowerCase('en-US');
        const expected = words[state.index].word.toLocaleLowerCase('en-US');
        if (!answer) {
          showFeedback('اكتب الكلمة أولاً ثم تحقّق من إجابتك.', 'error');
          ui.answerInput.classList.remove('shake');
          void ui.answerInput.offsetWidth;
          ui.answerInput.classList.add('shake');
          ui.answerInput.focus();
          return;
        }
        if (answer !== expected) {
          showFeedback('مش هي دي الكلمة الصحيحة. حاول مرة تانية!', 'error');
          ui.answerInput.classList.remove('shake');
          void ui.answerInput.offsetWidth;
          ui.answerInput.classList.add('shake');
          ui.answerInput.focus();
          return;
        }

        if (state.stage < 3) {
          state.stage += 1;
          state.started = true;
          saveProgress();
          render();
          showFeedback('إجابة صحيحة! ننتقل للمرحلة التالية.', 'success');
          ui.answerInput.focus();
          return;
        }

        state.index += 1;
        state.stage = 1;
        state.started = false;
        if (state.index >= words.length) {
          // حفظ حالة الانتهاء دون تجاوز حدود المصفوفة.
          state.index = 0;
          state.stage = 1;
          state.completed = true;
          saveProgress();
          render();
          ui.panelTitle.textContent = 'أحسنت! أنهيت الكلمات كلها 🎉';
          ui.instruction.textContent = 'أنهيت مجموعة الكلمات بنجاح. يمكنك البدء من جديد ومراجعتها مرة أخرى.';
          ui.wordDisplay.textContent = words[0].word;
          ui.wordCounter.textContent = 'اكتملت المجموعة';
          showFeedback('تم إكمال جميع الكلمات بنجاح.', 'success');
          return;
        }
        state.completed = false;
        saveProgress();
        render();
        showFeedback('ممتاز! الكلمة التالية جاهزة.', 'success');
      }

      ui.settingsToggle.addEventListener('click', () => {
        const open = ui.settingsMenu.classList.toggle('open');
        ui.settingsToggle.setAttribute('aria-expanded', String(open));
      });
      document.addEventListener('click', event => {
        if (!event.target.closest('.settings-wrap')) {
          ui.settingsMenu.classList.remove('open');
          ui.settingsToggle.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          ui.settingsMenu.classList.remove('open');
          ui.settingsToggle.setAttribute('aria-expanded', 'false');
        }
      });
      ui.lightTheme.addEventListener('click', () => applyTheme('light'));
      ui.darkTheme.addEventListener('click', () => applyTheme('dark'));
      ui.clearProgress.addEventListener('click', () => {
        const confirmed = window.confirm('هل تريد مسح تقدم الكلمات والبدء من جديد؟ سيظل المظهر المختار كما هو.');
        if (!confirmed) return;
        try { localStorage.removeItem(PROGRESS_KEY); } catch (error) { console.warn(error); }
        state = { index: 0, stage: 1, started: false, completed: false };
        ui.settingsMenu.classList.remove('open');
        ui.settingsToggle.setAttribute('aria-expanded', 'false');
        render();
      });
      ui.startBtn.addEventListener('click', startTest);
      ui.listenBtn.addEventListener('click', listenToWord);
      ui.checkBtn.addEventListener('click', checkAnswer);
      ui.backBtn.addEventListener('click', () => {
        state.started = false;
        saveProgress();
        render();
      });
      ui.answerInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') checkAnswer();
      });
      ui.answerInput.addEventListener('animationend', () => ui.answerInput.classList.remove('shake'));

      let savedTheme = 'light';
      try { savedTheme = localStorage.getItem(THEME_KEY) || 'light'; } catch (error) { /* القيمة الافتراضية */ }
      applyTheme(savedTheme);
      render();
    })();
  </script>
</body>
</html>

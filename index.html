<style>
:root{--ink:#18332e;--muted:#718780;--line:#dcebe5;--teal:#087f70;--paper:#f1faf6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer}.top{padding:14px max(calc((100% - 900px)/2),16px);background:#f7fffb;border-bottom:1px solid var(--line);font-size:21px;font-weight:900}main{max-width:900px;margin:auto;padding:20px 14px}.intro,.panel{background:white;border:1px solid var(--line);border-radius:23px;padding:20px}.intro{background:linear-gradient(135deg,#ddf7ec,#f9fffc)}h1{font-size:clamp(24px,5vw,34px);margin:0 0 6px}.intro p{color:var(--muted);margin:0}.progress{height:7px;background:#d5e9e0;border-radius:99px;margin-top:16px;overflow:hidden}.fill{height:100%;background:var(--teal);width:4%}.caption{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}.lesson{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.letter{font-size:clamp(68px,13vw,100px);font-weight:900;line-height:1;text-align:center;color:var(--teal);direction:ltr}.letter-name{text-align:center;color:var(--muted);margin:8px 0 20px}.actions,.nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.btn{border:1px solid var(--line);border-radius:13px;padding:11px 14px;background:#f6fcf9;color:var(--ink);font-weight:800}.primary{background:var(--teal);color:white;border-color:var(--teal)}.nav{justify-content:space-between;margin-top:15px}.nav .btn{flex:1}.btn:disabled{opacity:.4}.example{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:280px}.picture{width:min(100%,220px);aspect-ratio:1;border-radius:20px;background:linear-gradient(145deg,#e0f7ed,#f3fbf7);display:grid;place-items:center;overflow:hidden}.picture svg{width:100%;height:100%}.word{font-size:26px;font-weight:850;direction:ltr;margin-top:12px}.meaning{color:var(--muted);font-weight:750}.letters{dis </style></head><body><header class="top">لُغتي <span style="font-size:12px;color:#718780;font-weight:700">· حرف ورا حرف</span></header><main>
<section class="intro"><h1>يلا نتعلّم الإنجليزي 🌱</h1><p>شوف صورة الكلمة، اسمع اسم الحرف والكلمة، وكرّر بصوتك.</p><div class="progress"><div class="fill" id="fill"></div></div><div class="caption"><span id="pos">الحرف 1 من 26</span><span id="doneCount">0 حرف متعلّم</span></div></section>
<section class="lesson"><div class="panel"><div class="letter" id="letter">A a</div><div class="letter-name" id="letterName">اسم الحرف: إيه</div><div class="actions"><button class="btn primary" id="hearLetter">🔊 اسمع اسم الحرف</button><button class="btn" id="hearWord">🔊 اسمع الكلمة</button></div><div class="nav"><button class="btn" id="prev">السابق ←</button><button class="btn primary" id="next">التالي →</button></div><button class="btn" id="mark" style="width:100%;margin-top:9px">✓ اتعلّمت الحرف</button><p class="hint">الصورة مدمجة داخل الصفحة؛ لا يوجد تحميل من مواقع صور خارجية.</p></div>
<div class="panel example"><div class="picture" id="picture" role="img" aria-label="Apple — تفاحة"></div><div class="word" id="word">Apple</div><div class="meaning" id="meaning">تفاحة</div></div></section><h3>اختار حرف</h3><div class="letters" id="letters"></div><div class="footer">لُغتي — تعلّم بسيط، خطوة بخطوة.</div></main>

const $=id=>document.getElementById(id);let n=0,done=new Set();try{done=new Set(JSON.parse(localStorage.getItem('lughati-learned')||'[]'))}catch{}
function render(){const l=L[n];$('letter').textContent=l[0]+' '+l[1];$('letterName').textContent='اسم الحرف: '+l[2];$('word').textContent=l[3];$('meaning').textContent=l[4];$('picture').innerHTML='<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+icons[n]+'</svg>';$('picture').setAttribute('aria-label',l[3]+' — '+l[4]);$('prev').disabled=n===0;$('next').disabled=n===25;$('fill').style.width=((n+1)/26*100)+'%';$('pos').textContent='الحرف '+(n+1)+' من 26';$('doneCount').textContent=done.size+' حرف متعلّم';$('mark').textContent=done.has(n)?'✓ الحرف اتعلّم — اضغط لإلغاء':'✓ اتعلّمت الحرف';document.querySelectorAll('.letters button').forEach((b,i)=>{b.setAttribute('aria-current',String(i===n));b.classList.toggle('done',done.has(i))})}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
L.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l[0];b.type='button';b.addEventListener('click',()=>{n=i;render()});$('letters').appendChild(b)});
$('prev').onclick=()=>{if(n>0){n--;render()}};$('next').onclick=()=>{if(n<25){n++;render()}};$('hearLetter').onclick=()=>speak(L[n][0]);$('hearWord').onclick=()=>speak(L[n][3]);$('mark').onclick=()=>{done.has(n)?done.delete(n):done.add(n);try{localStorage.setItem('lughati-learned',JSON.stringify([...done]))}catch{}render()};render();

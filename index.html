function render(){const l=L[n];$('letter').textContent=l[0]+' '+l[1];$('letterName').textContent='اسم الحرف: '+l[2];$('word').textContent=l[3];$('meaning').textContent=l[4];$('picture').innerHTML='<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+icons[n]+'</svg>';$('picture').setAttribute('aria-label',l[3]+' — '+l[4]);$('prev').disabled=n===0;$('next').disabled=n===25;$('fill').style.width=((n+1)/26*100)+'%';$('pos').textContent='الحرف '+(n+1)+' من 26';$('doneCount').textContent=done.size+' حرف متعلّم';$('mark').textContent=done.has(n)?'✓ الحرف اتعلّم — اضغط لإلغاء':'✓ اتعلّمت الحرف';}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}

$('prev').onclick=()=>{if(n>0){n--;render()}};$('next').onclick=()=>{if(n<25){n++;render()}};$('hearLetter').onclick=()=>speak(L[n][0]);$('hearWord').onclick=()=>speak(L[n][3]);$('mark').onclick=()=>{done.has(n)?done.delete(n):done.add(n);try{localStorage.setItem('lughati-learned',JSON.stringify([...done]))}catch{}render()};render();
</script></body></html>

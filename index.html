</style></head><body><header class="top">لُغتي <span style="font-size:12px;color:#718780;font-weight:700">· حرف ورا حرف</span></header><main>
<section class="intro"><h1>يلا نتعلّم الإنجليزي 🌱</h1><p>شوف الصورة، اسمع اسم الحرف والكلمة، وكرّر بصوتك.</p><div class="progress"><div class="fill" id="fill"></div></div><div class="caption"><span id="pos">الحرف 1 من 26</span><span id="doneCount">0 حرف متعلّم</span></div></section>
<section class="lesson"><div class="panel"><div class="letter" id="letter">A a</div><div class="letter-name" id="letterName">اسم الحرف: إيه</div><div class="actions"><button class="btn primary" id="hearLetter">🔊 اسمع اسم الحرف</button><button class="btn" id="hearWord">🔊 اسمع الكلمة</button></div><div class="nav"><button class="btn" id="prev">السابق ←</button><button class="btn primary" id="next">التالي →</button></div><button class="btn" id="mark" style="width:100%;margin-top:9px">✓ اتعلّمت الحرف</button><p class="hint">الصورة مدمجة داخل الموقع، ولا تعتمد على موقع صور خارجي.</p></div>
<div class="panel example"><div class="photo" id="photo" role="img" aria-label="Apple — تفاحة"></div><div class="word" id="word">Apple</div><div class="meaning" id="meaning">تفاحة</div></div></section><h3>اختار حرف</h3><div class="letters" id="letters"></div><div class="footer">لُغتي — تعلّم بسيط، خطوة بخطوة.</div></main>
<script>
const L=[['A','a','إيه','Apple','تفاحة'],['B','b','بي','Ball','كرة'],['C','c','سي','City','مدينة'],['D','d','دي','Dog','كلب'],['E','e','إي','Egg','بيضة'],['F','f','إف','Fish','سمكة'],['G','g','جي','Goat','ماعز'],['H','h','إيتش','Hat','قبعة'],['I','i','آي','Ice','ثلج'],['J','j','جاي','Jam','مربّى'],['K','k','كاي','Key','مفتاح'],['L','l','إل','Lion','أسد'],['M','m','إم','Moon','قمر'],['N','n','إن','Nose','أنف'],['O','o','أو','Orange','برتقالة'],['P','p','پي','Pen','قلم'],['Q','q','كيو','Queen','ملكة'],['R','r','آر','Rain','مطر'],['S','s','إس','Sun','شمس'],['T','t','تي','Tree','شجرة'],['U','u','يو','Umbrella','مظلّة'],['V','v','ڤي','Van','سيارة نقل'],['W','w','دَبليو','Water','ماء'],['X','x','إكس','Box','صندوق'],['Y','y','واي','Yellow','أصفر'],['Z','z','زي','Zebra','حمار وحشي']];
const $=id=>document.getElementById(id);let n=0,done=new Set();try{done=new Set(JSON.parse(localStorage.getItem('lughati-learned')||'[]'))}catch{}
function photoPosition(i){let x,y;if(i<20){x=i%5*25;y=Math.floor(i/5)*25;$('photo').style.backgroundSize='500% 500%'}else{x=(i-20)*20;y=100;$('photo').style.backgroundSize='600% 500%'}$('photo').style.backgroundPosition=x+'% '+y+'%'}
function render(){let l=L[n];$('letter').textContent=l[0]+' '+l[1];$('letterName').textContent='اسم الحرف: '+l[2];$('word').textContent=l[3];$('meaning').textContent=l[4];$('photo').setAttribute('aria-label',l[3]+' — '+l[4]);photoPosition(n);$('prev').disabled=n===0;$('next').disabled=n===25;$('fill').style.width=((n+1)/26*100)+'%';$('pos').textContent='الحرف '+(n+1)+' من 26';$('doneCount').textContent=done.size+' حرف متعلّم';$('mark').textContent=done.has(n)?'✓ الحرف اتعلّم — اضغط لإلغاء':'✓ اتعلّمت الحرف';document.querySelectorAll('.letters button').forEach((b,i)=>{b.setAttribute('aria-current',String(i===n));b.classList.toggle('done',done.has(i))})}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
L.forEach((l,i)=>{let b=document.createElement('button');b.textContent=l[0];b.type='button';b.addEventListener('click',()=>{n=i;render()});$('letters').appendChild(b)});
$('prev').onclick=()=>{if(n>0){n--;render()}};$('next').onclick=()=>{if(n<25){n++;render()}};$('hearLetter').onclick=()=>speak(L[n][0]);$('hearWord').onclick=()=>speak(L[n][3]);$('mark').onclick=()=>{done.has(n)?done.delete(n):done.add(n);try{localStorage.setItem('lughati-learned',JSON.stringify([...done]))}catch{}render()};render();
</script></body></html>

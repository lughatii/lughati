<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eff9f5"><title>لُغتي — تعلّم الإنجليزية</title>
<style>
:root{--ink:#18332e;--muted:#718780;--line:#dcebe5;--teal:#087f70;--paper:#f1faf6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer}.top{padding:14px max(calc((100% - 900px)/2),16px);background:#f7fffb;border-bottom:1px solid var(--line);font-size:21px;font-weight:900}main{max-width:900px;margin:auto;padding:20px 14px}.intro,.panel{background:white;border:1px solid var(--line);border-radius:23px;padding:20px}.intro{background:linear-gradient(135deg,#ddf7ec,#f9fffc)}h1{font-size:clamp(24px,5vw,34px);margin:0 0 6px}.intro p{color:var(--muted);margin:0}.progress{height:7px;background:#d5e9e0;border-radius:99px;margin-top:16px;overflow:hidden}.fill{height:100%;background:var(--teal);width:4%}.caption{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}.lesson{display:flex;flex-direction:column;gap:14px;margin-top:14px;max-width:620px;margin-left:auto;margin-right:auto}.letter{font-size:clamp(68px,13vw,100px);font-weight:900;line-height:1;text-align:center;color:var(--teal);direction:ltr}.letter-name{text-align:center;color:var(--muted);margin:8px 0 20px}.actions,.nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.btn{border:1px solid var(--line);border-radius:13px;padding:11px 14px;background:#f6fcf9;color:var(--ink);font-weight:800}.primary{background:var(--teal);color:white;border-color:var(--teal)}.nav{justify-content:space-between;margin-top:15px}.nav .btn{flex:1}.btn:disabled{opacity:.4}.example{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}.picture{width:min(100%,190px);aspect-ratio:1;border-radius:20px;background:linear-gradient(145deg,#e0f7ed,#f3fbf7);display:grid;place-items:center;overflow:hidden}.picture img{display:block;width:100%;height:100%;object-fit:contain}.word{font-size:26px;font-weight:850;direction:ltr;margin-top:12px}.meaning{color:var(--muted);font-weight:750}.letters{display:none!important}.letters button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:850}.letters button[aria-current=true]{background:var(--teal);color:white}.letters button.done{box-shadow:inset 0 -3px #77d5ad}.hint{font-size:12px;color:var(--muted);line-height:1.7}.footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0}@media(max-width:600px){.lesson{grid-template-columns:1fr}.example{min-height:0;order:-1;display:flex;flex-direction:column;align-items:center;text-align:center}.picture{width:min(100%,170px);aspect-ratio:1;display:grid;place-items:center;overflow:hidden}.picture img{display:block;width:100%;height:100%;object-fit:contain}.example .word{font-size:30px;font-weight:900;margin-top:8px}.example .meaning{font-size:20px}.letters{grid-template-columns:repeat(7,1fr)}}
</style></head><body><header class="top">لُغتي <span style="font-size:12px;color:#718780;font-weight:700">· حرف ورا حرف</span></header><main>
<section class="intro"><h1>يلا نتعلّم الإنجليزي 🌱</h1><p>شوف صورة الكلمة، اسمع اسم الحرف والكلمة، وكرّر بصوتك.</p><div class="progress"><div class="fill" id="fill"></div></div><div class="caption"><span id="pos">الحرف 1 من 26</span><span id="doneCount">0 حرف متعلّم</span></div></section>
<section class="lesson"><div class="panel example"><div class="letter" id="letter">A a</div><div class="letter-name" id="letterName">اسم الحرف: إيه</div><div class="picture" id="picture" role="img" aria-label="Apple — تفاحة"></div><div class="word" id="word">Apple</div><div class="meaning" id="meaning">تفاحة</div><div class="actions" style="margin-top:18px"><button class="btn primary" id="hearLetter">🔊 اسمع اسم الحرف</button><button class="btn" id="hearWord">🔊 اسمع الكلمة</button></div><button class="btn" id="mark" style="width:100%;margin-top:12px">✓ اتعلّمت الحرف</button><p class="hint">الصورة توضيحية للكلمة، والنطق متاح بالضغط.</p><div class="nav"><button class="btn" id="prev">السابق ←</button><button class="btn primary" id="next">التالي →</button></div></div></section><div class="footer">لُغتي — تعلّم بسيط، خطوة بخطوة.</div></main>
<script>
const L=[['A','a','إيه','Apple','تفاحة'],['B','b','بي','Ball','كرة'],['C','c','سي','City','مدينة'],['D','d','دي','Dog','كلب'],['E','e','إي','Egg','بيضة'],['F','f','إف','Fish','سمكة'],['G','g','جي','Goat','ماعز'],['H','h','إيتش','Hat','قبعة'],['I','i','آي','Ice','ثلج'],['J','j','جاي','Jam','مربّى'],['K','k','كاي','Key','مفتاح'],['L','l','إل','Lion','أسد'],['M','m','إم','Moon','قمر'],['N','n','إن','Nose','أنف'],['O','o','أو','Orange','برتقالة'],['P','p','پي','Pen','قلم'],['Q','q','كيو','Queen','ملكة'],['R','r','آر','Rain','مطر'],['S','s','إس','Sun','شمس'],['T','t','تي','Tree','شجرة'],['U','u','يو','Umbrella','مظلّة'],['V','v','ڤي','Van','سيارة نقل'],['W','w','دَبليو','Water','ماء'],['X','x','إكس','X-ray','أشعة سينية'],['Y','y','واي','Yellow','أصفر'],['Z','z','زي','Zebra','حمار وحشي']];
const pictures=["https://loremflickr.com/480/480/apple%2Cfruit?lock=45015","https://loremflickr.com/480/480/soccer%2Cball?lock=55379","https://loremflickr.com/480/480/city%2Cskyline?lock=87290","https://loremflickr.com/480/480/dog?lock=93880","https://loremflickr.com/480/480/egg?lock=21738","https://loremflickr.com/480/480/fish?lock=1017","https://loremflickr.com/480/480/goat?lock=51149","https://loremflickr.com/480/480/hat?lock=76388","https://loremflickr.com/480/480/ice%2Ccubes?lock=11390","https://loremflickr.com/480/480/jam%2Cjar?lock=86431","https://loremflickr.com/480/480/key?lock=2342","https://loremflickr.com/480/480/lion?lock=3101","https://loremflickr.com/480/480/moon?lock=74656","https://loremflickr.com/480/480/nose?lock=37765","https://loremflickr.com/480/480/orange%2Cfruit?lock=26255","https://loremflickr.com/480/480/pen?lock=85688","https://loremflickr.com/480/480/queen%2Ccrown?lock=92845","https://loremflickr.com/480/480/rain%2Cclouds?lock=3685","https://loremflickr.com/480/480/sun?lock=24140","https://loremflickr.com/480/480/tree?lock=90464","https://loremflickr.com/480/480/umbrella?lock=62109","https://loremflickr.com/480/480/van%2Cvehicle?lock=70742","https://loremflickr.com/480/480/water%2Cglass?lock=86802","https://loremflickr.com/480/480/xray%2Cmedical?lock=39131","https://loremflickr.com/480/480/yellow%2Ccolor%2Cobject?lock=85172","https://loremflickr.com/480/480/zebra%2Canimal?lock=78469"];
const emojis=["🍎","⚽","🏙️","🐶","🥚","🐟","🐐","🎩","🧊","🍯","🔑","🦁","🌙","👃","🍊","🖊️","👑","🌧️","☀️","🌳","☂️","🚐","💧","🩻","🟡","🦓"];
const $=id=>document.getElementById(id);let n=0,done=new Set();try{done=new Set(JSON.parse(localStorage.getItem('lughati-learned')||'[]'))}catch{}
function render(){const l=L[n];$('letter').textContent=l[0]+' '+l[1];$('letterName').textContent='اسم الحرف: '+l[2];$('word').textContent=l[3];$('meaning').textContent=l[4];const img=document.createElement('img');img.loading='lazy';img.alt=l[3];img.src=pictures[n];img.onerror=()=>{$('picture').textContent=emojis[n];$('picture').style.fontSize='100px';};$('picture').style.fontSize='';$('picture').textContent='';$('picture').appendChild(img);$('picture').setAttribute('aria-label',l[3]+' — '+l[4]);$('prev').disabled=n===0;$('next').disabled=n===25;$('fill').style.width=((n+1)/26*100)+'%';$('pos').textContent='الحرف '+(n+1)+' من 26';$('doneCount').textContent=done.size+' حرف متعلّم';$('mark').textContent=done.has(n)?'✓ الحرف اتعلّم — اضغط لإلغاء':'✓ اتعلّمت الحرف';}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}

$('prev').onclick=()=>{if(n>0){n--;render()}};$('next').onclick=()=>{if(n<25){n++;render()}};$('hearLetter').onclick=()=>speak(L[n][0]);$('hearWord').onclick=()=>speak(L[n][3]);$('mark').onclick=()=>{done.has(n)?done.delete(n):done.add(n);try{localStorage.setItem('lughati-learned',JSON.stringify([...done]))}catch{}render()};render();
</script></body></html>

/* تحسين تجربة الهاتف دون تغيير منطق التمرين */

body{isolation:isolate}

<body><header class="top">لُغتي <span class="muted" style="font-size:12px">· خاصة بي</span></header>
<main><a class="back" href="index.html">← الرجوع للرئيسية</a>
<section class="hero"><h1>مرحلتي الخاصة — مفردات متقدمة</h1><p class="muted" style="margin:0">اتدرّب على الكلمات اللي اخترتها، واكتب كل كلمة 3 مرات ثم اختار معناها الصحيح.</p><div class="progress"><div class="fill" id="progress"></div></div><div class="caption"><span id="count">الكلمة 1</span><span id="stageCount">الكتابة 1 من 3</span></div></section>
<section class="panel" id="lesson"><div class="stage" id="category"></div><div class="emoji" id="emoji"></div><div class="word" id="word"></div><div class="meaning" id="meaning"></div><div class="row"><button class="btn" id="hear">🔊 اسمع الكلمة</button><button class="btn" id="restart">↻ ابدأ من الأول</button></div>
<div id="writing"><p class="hint" id="instruction">اكتب الكلمة فوق الحروف الشفافة.</p><div class="write-area"><div class="ghost-overlay" id="ghostOverlay" aria-hidden="true"></div><input class="write-input" id="answer" placeholder=" " autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="اكتب الكلمة الإنجليزية"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="row"><button class="btn primary" id="check">تحقّق</button><button class="btn hidden" id="nextWrite">المرة التالية ←</button></div></div>
<div id="quiz" class="hidden"><p class="hint">اختار معنى الكلمة الإنجليزية الصحيح.</p><div class="options" id="options"></div><div class="feedback" id="quizFeedback" role="status" aria-live="polite"></div><div class="row"><button class="btn primary hidden" id="nextWord">الكلمة التالية ←</button></div></div>
</section></main>
<script>
(()=> {
const words=[
{en:"accompany",ar:"يرافق",emoji:'📘',group:'مفردات خاصة بي'},
{en:"indicate",ar:"يشير إلى",emoji:'📘',group:'مفردات خاصة بي'},
{en:"migration",ar:"هجرة",emoji:'📘',group:'مفردات خاصة بي'},
{en:"amphibious",ar:"برمائي",emoji:'📘',group:'مفردات خاصة بي'},
{en:"intensify",ar:"يكثّف",emoji:'📘',group:'مفردات خاصة بي'},
{en:"mitigate",ar:"يخفّف",emoji:'📘',group:'مفردات خاصة بي'},
{en:"expansion",ar:"توسّع",emoji:'📘',group:'مفردات خاصة بي'},
{en:"large-scale",ar:"واسع النطاق",emoji:'📘',group:'مفردات خاصة بي'},
{en:"phenomenon",ar:"ظاهرة",emoji:'📘',group:'مفردات خاصة بي'},
{en:"expose",ar:"يكشف، يعرّض لـ",emoji:'📘',group:'مفردات خاصة بي'},
{en:"megacities",ar:"مدن عملاقة",emoji:'📘',group:'مفردات خاصة بي'},
{en:"potential",ar:"قدرة، إمكانية، محتمل",emoji:'📘',group:'مفردات خاصة بي'},
{en:"accelerated",ar:"معجَّل، مسرع",emoji:'📘',group:'مفردات خاصة بي'},
{en:"estimated",ar:"مقدَّر",emoji:'📘',group:'مفردات خاصة بي'},
{en:"poverty",ar:"فقر",emoji:'📘',group:'مفردات خاصة بي'},
{en:"activist",ar:"ناشط",emoji:'📘',group:'مفردات خاصة بي'},
{en:"ethical",ar:"أخلاقي",emoji:'📘',group:'مفردات خاصة بي'},
{en:"precaution",ar:"إجراء احترازي",emoji:'📘',group:'مفردات خاصة بي'},
{en:"adaptation",ar:"تأقلم، تكييف",emoji:'📘',group:'مفردات خاصة بي'},
{en:"factor",ar:"عامل",emoji:'📘',group:'مفردات خاصة بي'},
{en:"pressing",ar:"ملحّ",emoji:'📘',group:'مفردات خاصة بي'},
{en:"address",ar:"عنوان، يخاطب، يتعامل مع",emoji:'📘',group:'مفردات خاصة بي'},
{en:"flood-prone",ar:"عرضة للفيضانات",emoji:'📘',group:'مفردات خاصة بي'},
{en:"primarily",ar:"بشكل رئيسي",emoji:'📘',group:'مفردات خاصة بي'},
{en:"admit",ar:"يعترف",emoji:'📘',group:'مفردات خاصة بي'},
{en:"frequency",ar:"تكرار",emoji:'📘',group:'مفردات خاصة بي'},
{en:"process",ar:"عملية",emoji:'📘',group:'مفردات خاصة بي'},
{en:"advocate",ar:"يدافع",emoji:'📘',group:'مفردات خاصة بي'},
{en:"generation",ar:"جيل",emoji:'📘',group:'مفردات خاصة بي'},
{en:"projection",ar:"توقّع، تقدير، احتمال",emoji:'📘',group:'مفردات خاصة بي'},
{en:"agreement",ar:"موافقة، اتفاق",emoji:'📘',group:'مفردات خاصة بي'},
{en:"glaciers",ar:"أنهار جليدية",emoji:'📘',group:'مفردات خاصة بي'},
{en:"recognition",ar:"اعتراف",emoji:'📘',group:'مفردات خاصة بي'},
{en:"announcement",ar:"إعلان",emoji:'📘',group:'مفردات خاصة بي'},
{en:"growing",ar:"نامٍ، متزايد",emoji:'📘',group:'مفردات خاصة بي'},
{en:"renewable",ar:"متجدّد",emoji:'📘',group:'مفردات خاصة بي'},
{en:"approximately",ar:"تقريبًا",emoji:'📘',group:'مفردات خاصة بي'},
{en:"ice sheet",ar:"غطاء جليدي",emoji:'📘',group:'مفردات خاصة بي'},
{en:"require",ar:"يتطلّب",emoji:'📘',group:'مفردات خاصة بي'},
{en:"architecture",ar:"هندسة معمارية",emoji:'📘',group:'مفردات خاصة بي'},
{en:"identified",ar:"محدّد، تم تحديده",emoji:'📘',group:'مفردات خاصة بي'},
{en:"reside",ar:"يقيم، يسكن",emoji:'📘',group:'مفردات خاصة بي'}
];
let index=0,attempt=1,phase='write',learned=new Set();
try{const s=JSON.parse(localStorage.getItem('lughati-stage3-progress')||'{}');index=Number.isInteger(s.index)&&s.index>=0&&s.index<words.length?s.index:0;learned=new Set(Array.isArray(s.learned)?s.learned:[])}catch{}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('lughati-stage3-progress',JSON.stringify({index,learned:[...learned]}))}catch{}}
function speak(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const en=new SpeechSynthesisUtterance(words[index].en);en.lang='en-US';en.rate=.8;const ar=new SpeechSynthesisUtterance(words[index].ar);ar.lang='ar-EG';ar.rate=.85;speechSynthesis.speak(en);speechSynthesis.speak(ar)}
function drawTrace(){const w=words[index].en;let hint='';const visible=new Set();if(attempt===2){if(w.length<=2){for(let i=0;i<w.length;i++)visible.add(i)}else{visible.add(1);visible.add(Math.min(3,w.length-1));}}[...w].forEach((ch,i)=>{if(attempt===1)hint+=ch;else if(attempt===2)hint+=visible.has(i)?ch:' ';});$('ghostOverlay').textContent=hint;$('stageCount').textContent='الكتابة '+attempt+' من 3';$('instruction').textContent=attempt===1?'المرة الأولى: الكلمة كاملة شفافة داخل الخانة، واكتب فوقها.':attempt===2?'المرة الثانية: يظهر حرفان فقط، واكتب باقي الحروف بنفسك.':'';$('category').classList.toggle('hidden',attempt===3);$('emoji').classList.toggle('hidden',attempt===3);$('word').classList.toggle('hidden',attempt===3);$('meaning').classList.toggle('hidden',attempt===3);$('hear').classList.toggle('hidden',attempt===3);$('ghostOverlay').classList.toggle('hidden',attempt===3);}
function render(){const w=words[index];phase='write';attempt=1;$('category').textContent='قسم '+w.group;$('emoji').textContent=w.emoji;$('word').textContent=w.en;$('meaning').textContent=w.ar;$('category').classList.remove('hidden');$('emoji').classList.remove('hidden');$('word').classList.remove('hidden');$('meaning').classList.remove('hidden');$('hear').classList.remove('hidden');$('ghostOverlay').classList.remove('hidden');$('count').textContent='الكلمة '+(index+1)+' من '+words.length;$('progress').style.width=(learned.size/words.length*100)+'%';$('writing').classList.remove('hidden');$('quiz').classList.add('hidden');$('feedback').textContent='';$('answer').value='';$('check').classList.remove('hidden');$('nextWrite').classList.add('hidden');drawTrace();save()}
function checkWriting(){if(phase!=='write')return;const entered=$('answer').value.trim().replace(/\s+/g,'').toLowerCase();if(entered!==words[index].en.toLowerCase()){$('feedback').textContent='لسه مش مظبوطة، جرّب تاني.';$('feedback').style.color='#a85b20';return} $('feedback').textContent='صح!';$('check').classList.add('hidden');if(attempt<3){attempt++;$('answer').value='';$('feedback').textContent='';$('check').classList.remove('hidden');drawTrace();$('answer').focus()}else{phase='quiz';$('answer').value='';$('writing').classList.add('hidden');$('quiz').classList.remove('hidden');makeOptions()}}
function makeOptions(){const correct=words[index];const ids=new Set([index]);while(ids.size<4)ids.add(Math.floor(Math.random()*words.length));const choices=[...ids].sort(()=>Math.random()-.5);$('options').textContent='';$('quizFeedback').textContent='';$('nextWord').classList.add('hidden');choices.forEach(i=>{const b=document.createElement('button');b.className='btn';b.textContent=words[i].ar;b.onclick=()=>{if(phase!=='quiz')return;if(i===index){phase='advance';b.style.background='#d9f7e8';b.style.borderColor='#087f70';$('quizFeedback').textContent='إجابة صحيحة!';$('quizFeedback').style.color='#087f70';learned.add(index);save();$('progress').style.width=(learned.size/words.length*100)+'%';$('answer').value='';index=(index+1)%words.length;setTimeout(render,350)}else{b.style.background='#fde8e5';b.style.borderColor='#b85a4a';$('quizFeedback').textContent='جرّب تاني، ركّز في معنى الاختيار.';$('quizFeedback').style.color='#a85b20'}};$('options').appendChild(b)})}
$('hear').onclick=speak;$('restart').onclick=()=>{index=0;attempt=1;phase='write';learned.clear();save();render()};$('check').onclick=checkWriting;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')checkWriting()});$('nextWrite').onclick=()=>{};$('nextWord').onclick=()=>{};render();
})();
</script>
<script>
(()=>{const key='lughati-appearance-v1';const colors=[['أزرق','#1687ff'],['أخضر','#13b981'],['بنفسجي','#8b5cf6'],['وردي','#ec4899'],['برتقالي','#f97316'],['أحمر','#ef4444'],['تركواز','#06b6d4'],['أسود فضي','#64748b'],['ذهبي','#d4a017'],['بنفسجي داكن','#6d28d9']];
let prefs={color:'#1687ff',mode:'auto'};try{prefs={...prefs,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{}
const apply=()=>{document.documentElement.style.setProperty('--ui-accent',prefs.color);const dark=prefs.mode==='dark'||(prefs.mode==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.body.dataset.lughatiMode=dark?'dark':'light';document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#080f1c':prefs.color)};
const save=()=>{try{localStorage.setItem(key,JSON.stringify(prefs))}catch{}apply()};
const b=document.createElement('button');b.id='lughatiThemeButton';b.type='button';b.textContent='🎨 المظهر';b.setAttribute('aria-expanded','false');
const p=document.createElement('section');p.id='lughatiThemePanel';p.setAttribute('aria-label','إعدادات المظهر');p.innerHTML='<h3>تخصيص المظهر</h3><p>اختار اللون</p><div class="lughati-swatches"></div><p>الخلفية والوضع الليلي</p><div class="lughati-mode"><button type="button" data-mode="auto">حسب الجهاز</button><button type="button" data-mode="dark">دارك مود</button><button type="button" data-mode="light">فاتح</button></div>';
colors.forEach(([name,color])=>{const s=document.createElement('button');s.type='button';s.className='lughati-swatch';s.title=name;s.setAttribute('aria-label',name);s.style.background=color;s.setAttribute('aria-pressed',String(prefs.color===color));s.onclick=()=>{prefs.color=color;p.querySelectorAll('.lughati-swatch').forEach(x=>x.setAttribute('aria-pressed',String(x===s)));save()};p.querySelector('.lughati-swatches').appendChild(s)});
p.querySelectorAll('[data-mode]').forEach(x=>{x.onclick=()=>{prefs.mode=x.dataset.mode;save()}});
b.onclick=()=>{p.classList.toggle('open');b.setAttribute('aria-expanded',String(p.classList.contains('open')))};
document.addEventListener('click',e=>{if(!p.contains(e.target)&&e.target!==b){p.classList.remove('open');b.setAttribute('aria-expanded','false')}});
document.body.append(b,p);apply();window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(prefs.mode==='auto')apply()});
})();
</script>

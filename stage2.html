<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eff9f5"><title>لُغتي — المرحلة الثانية</title><style>:root{--ink:#18332e;--muted:#718780;--line:#dcebe5;--teal:#087f70;--paper:#f1faf6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer}.top{padding:14px max(calc((100% - 900px)/2),16px);background:#f7fffb;border-bottom:1px solid var(--line);font-size:21px;font-weight:900}main{max-width:900px;margin:auto;padding:20px 14px}.intro,.panel{background:white;border:1px solid var(--line);border-radius:23px;padding:20px}.intro{background:linear-gradient(135deg,#ddf7ec,#f9fffc)}h1{font-size:clamp(24px,5vw,34px);margin:0 0 6px}.intro p{color:var(--muted);margin:0}.progress{height:7px;background:#d5e9e0;border-radius:99px;margin-top:16px;overflow:hidden}.fill{height:100%;background:var(--teal);width:4%}.caption{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}.lesson{display:flex;flex-direction:column;gap:14px;margin-top:14px;max-width:620px;margin-left:auto;margin-right:auto}.letter{font-size:clamp(68px,13vw,100px);font-weight:900;line-height:1;text-align:center;color:var(--teal);direction:ltr}.letter-name{text-align:center;color:var(--muted);margin:8px 0 20px}.actions,.nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.btn{border:1px solid var(--line);border-radius:13px;padding:11px 14px;background:#f6fcf9;color:var(--ink);font-weight:800}.primary{background:var(--teal);color:white;border-color:var(--teal)}.nav{justify-content:space-between;margin-top:15px}.nav .btn{flex:1}.btn:disabled{opacity:.4}.example{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}.picture{width:min(100%,190px);aspect-ratio:1;border-radius:20px;background:linear-gradient(145deg,#e0f7ed,#f3fbf7);display:grid;place-items:center;overflow:hidden}.picture img{display:block;width:100%;height:100%;object-fit:contain}.word{font-size:26px;font-weight:850;direction:ltr;margin-top:12px}.meaning{color:var(--muted);font-weight:750}.letters{display:none!important}body.quiz-mode .intro,body.quiz-mode .lesson,body.quiz-mode .footer{display:none!important}body.quiz-mode main{max-width:720px;min-height:calc(100vh - 55px);display:flex;align-items:center;justify-content:center}body.quiz-mode #soundQuiz{width:100%;margin:0!important}.letters button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:850}.letters button[aria-current=true]{background:var(--teal);color:white}.letters button.done{box-shadow:inset 0 -3px #77d5ad}.hint{font-size:12px;color:var(--muted);line-height:1.7}.footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0}@media(max-width:600px){.lesson{grid-template-columns:1fr}.example{min-height:0;order:-1;display:flex;flex-direction:column;align-items:center;text-align:center}.picture{width:min(100%,170px);aspect-ratio:1;display:grid;place-items:center;overflow:hidden}.picture img{display:block;width:100%;height:100%;object-fit:contain}.example .word{font-size:30px;font-weight:900;margin-top:8px}.example .meaning{font-size:20px}.letters{grid-template-columns:repeat(7,1fr)}}

/* Responsive layout: phones, tablets, and desktop */
html{min-width:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-width:0;overflow-x:hidden}
button{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
main{width:100%}
.lesson{width:100%}
#soundQuiz{min-width:0}
#quizOptions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#quizOptions .btn{min-width:0;overflow-wrap:anywhere;white-space:normal;min-height:54px}
#quizContinueWrap .btn{max-width:100%;white-space:normal}
@media(min-width:1000px){
  main{max-width:1080px;padding:28px 24px}
  .top{font-size:23px}
  .intro,.panel{padding:28px}
  .lesson{max-width:760px}
  .picture{width:min(100%,240px)}
  .word{font-size:30px}
  #soundQuiz{max-width:820px;margin-inline:auto!important}
  #quizOptions{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
}
@media(min-width:601px) and (max-width:999px){
  main{max-width:850px;padding:22px 20px}
  .lesson{max-width:680px}
  .intro,.panel{padding:22px}
  .picture{width:min(100%,210px)}
  body.quiz-mode main{padding:20px}
  body.quiz-mode #soundQuiz{min-height:calc(100dvh - 40px)!important}
}
@media(max-width:600px){
  .top{padding:13px 16px;font-size:20px}
  main{padding:14px 10px}
  .intro,.panel{padding:16px;border-radius:18px}
  .lesson{display:flex;gap:12px;margin-top:12px}
  .letter{font-size:clamp(64px,19vw,88px)}
  .picture{width:min(55vw,180px);max-width:100%}
  .actions{gap:8px}
  .btn{padding:11px 10px;min-height:44px}
  .nav{gap:8px}
  .nav .btn{min-width:0}
  #quizOptions{grid-template-columns:1fr;gap:9px}
  #quizOptions .btn{width:100%;text-align:center}
  body.quiz-mode main{width:100%;min-height:100dvh;min-height:100vh;padding:10px;align-items:stretch}
  body.quiz-mode #soundQuiz{min-height:calc(100dvh - 20px)!important;min-height:calc(100vh - 20px)!important;padding:16px;border-radius:18px}
  body.quiz-mode #quizOptions{grid-template-columns:1fr}
}
@media(max-width:360px){
  main{padding-inline:8px}
  .intro,.panel{padding:13px}
  .actions .btn{font-size:14px}
  .letter-name{margin-bottom:14px}
  .picture{width:min(52vw,155px)}
  body.quiz-mode main{padding:7px}
  body.quiz-mode #soundQuiz{padding:12px}
}
@media(hover:none){
  .btn{min-height:46px}
}


.encouragement{margin-top:14px;padding:12px 14px;border-radius:15px;background:#fff7d6;border:1px solid #f3e5a4;color:#76551b;font-weight:800;text-align:center;line-height:1.7}
.encouragement small{display:block;font-size:12px;font-weight:650;color:#8b7444}
@media(max-width:600px){.encouragement{padding:10px 11px;font-size:14px}}
\n
/* Daily vocabulary: body parts */
.vocab-wrap{margin-bottom:16px}.vocab-hero{background:linear-gradient(135deg,#e3f5f1,#fff);border:1px solid var(--line);border-radius:23px;padding:22px;margin-bottom:12px}
.vocab-kicker{font-size:12px;letter-spacing:.08em;color:var(--teal);font-weight:900}.vocab-hero h1{margin:6px 0 8px}.vocab-hero p{margin:0;color:var(--muted);line-height:1.8}
.vocab-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.vocab-tabs .btn.active{background:var(--teal);color:white;border-color:var(--teal)}
.vocab-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:440px;margin:0 auto}
.vocab-card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;min-width:0;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.vocab-symbol{height:100px;display:grid;place-items:center;background:#f0f8f5;border-radius:14px;font-size:52px}
.vocab-word{font-size:28px;font-weight:900;direction:ltr;text-align:center}.vocab-meaning{text-align:center;color:var(--muted);font-weight:750}
.vocab-pron{text-align:center;font-size:12px;color:var(--muted)}.vocab-card .btn{width:100%;padding:11px 8px}
.vocab-next{max-width:440px;margin:12px auto 0}.vocab-next .btn{width:100%}
.vocab-quiz{margin-top:14px}.vocab-quiz h3{margin:0 0 8px}.vocab-quiz-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.vocab-quiz-options .btn{white-space:normal}
@media(max-width:600px){.vocab-hero{padding:17px;border-radius:18px}.vocab-grid{grid-template-columns:minmax(0,1fr);gap:8px}.vocab-card{padding:18px}.vocab-word{font-size:26px}.vocab-symbol{height:88px}.vocab-quiz-options{grid-template-columns:1fr}}
 .stage-nav{margin-bottom:12px}.stage-nav a{display:inline-block;text-decoration:none}</style></head><body><header class="top">لُغتي <span style="font-size:12px;color:#718780;font-weight:700">· المرحلة الثانية</span></header><main><div class="stage-nav"><a class="btn" href="index.html">← الرجوع للمرحلة الأولى</a></div><section class="vocab-wrap" id="bodyVocabulary">
  <div class="vocab-hero">
    <div class="vocab-kicker">DAILY VOCABULARY · 01</div>
    <h1>أجزاء الجسم <span style="color:var(--teal)">· Body Parts</span></h1>
    <p>اتعلّم كلمة واحدة في كل مرة. اسمع نطقها ومعناها، ولما تخلص اضغط على الكلمة التالية.</p>
    <div class="progress"><div class="fill" id="bodyProgress" style="width:0%"></div></div>
    <div class="caption"><span id="bodyLearnedLabel">0 من 20 كلمة اتعلّمتها</span><span>المستوى: مبتدئ</span></div>
  </div>
  <div class="panel">
    <div class="vocab-tabs" id="bodyTabs">
      <button class="btn active" data-body-group="all">الكل</button>
      <button class="btn" data-body-group="body">الجسم</button>
      <button class="btn" data-body-group="face">الوجه</button>
      <button class="btn" data-body-group="hands">اليد والقدم</button>
    </div>
    <div class="vocab-grid" id="bodyWordGrid"></div>
    <div class="vocab-next actions"><button class="btn primary" id="bodyNextWord">الكلمة التالية ←</button></div>
    <div class="vocab-quiz">
      <h3>اختبر نفسك</h3>
      <p class="hint">اختار معنى الكلمة الإنجليزية الصحيح.</p>
      <div class="vocab-quiz-options" id="bodyQuizOptions"></div>
      <p id="bodyQuizFeedback" role="status" aria-live="polite" style="font-weight:800"></p>
      <div class="actions"><button class="btn primary" id="bodyNextQuestion">سؤال جديد ←</button></div>
    </div>
  </div>
</section></main><script>/* Body-parts daily vocabulary */
(()=>{
const words=[
{en:'Head',ar:'رأس',pron:'هِد',emoji:'🧑',group:'body',example:'Touch your head.',translation:'المس رأسك.'},
{en:'Neck',ar:'رقبة',pron:'نِك',emoji:'🧍',group:'body',example:'My neck hurts.',translation:'رقبتي تؤلمني.'},
{en:'Shoulder',ar:'كتف',pron:'شولدر',emoji:'💪',group:'body',example:'Move your shoulders.',translation:'حرّك كتافك.'},
{en:'Arm',ar:'ذراع',pron:'آرم',emoji:'💪',group:'body',example:'Raise your arm.',translation:'ارفع ذراعك.'},
{en:'Elbow',ar:'كوع',pron:'إلبو',emoji:'🦾',group:'body',example:'Bend your elbow.',translation:'اثنِ كوعك.'},
{en:'Chest',ar:'صدر',pron:'تشِست',emoji:'🫁',group:'body',example:'Take a deep breath into your chest.',translation:'خد نفس عميق.'},
{en:'Back',ar:'ظهر',pron:'باك',emoji:'🧍',group:'body',example:'My back is tired.',translation:'ظهري تعبان.'},
{en:'Stomach',ar:'بطن',pron:'ستَمَك',emoji:'🧍',group:'body',example:'My stomach hurts.',translation:'بطني بتوجعني.'},
{en:'Leg',ar:'ساق',pron:'لِج',emoji:'🦵',group:'body',example:'Stretch your legs.',translation:'افرد رجليك.'},
{en:'Knee',ar:'ركبة',pron:'ني',emoji:'🦵',group:'body',example:'Bend your knee.',translation:'اثنِ ركبتك.'},
{en:'Foot',ar:'قدم',pron:'فوت',emoji:'🦶',group:'hands',example:'My foot is wet.',translation:'رجلي مبلولة.'},
{en:'Face',ar:'وجه',pron:'فيس',emoji:'🙂',group:'face',example:'Wash your face.',translation:'اغسل وشك.'},
{en:'Eye',ar:'عين',pron:'آي',emoji:'👁️',group:'face',example:'I have brown eyes.',translation:'عينيّ لونهم بني.'},
{en:'Ear',ar:'أذن',pron:'إير',emoji:'👂',group:'face',example:'My left ear hurts.',translation:'ودني الشمال بتوجعني.'},
{en:'Nose',ar:'أنف',pron:'نوز',emoji:'👃',group:'face',example:'My nose is cold.',translation:'مناخيري ساقعة.'},
{en:'Mouth',ar:'فم',pron:'ماوث',emoji:'👄',group:'face',example:'Open your mouth.',translation:'افتح بقك.'},
{en:'Tooth',ar:'سِنّ',pron:'توث',emoji:'🦷',group:'face',example:'I brush my teeth.',translation:'بغسل سناني.'},
{en:'Hand',ar:'يد',pron:'هاند',emoji:'✋',group:'hands',example:'Raise your hand.',translation:'ارفع إيدك.'},
{en:'Finger',ar:'إصبع',pron:'فينجر',emoji:'☝️',group:'hands',example:'Point with one finger.',translation:'شاور بإصبع واحد.'},
{en:'Toe',ar:'إصبع القدم',pron:'تو',emoji:'🦶',group:'hands',example:'I hurt my toe.',translation:'إصبع رجلي اتخبط.'}
];
let group='all',current=0,learned=new Set(),asked=null,answered=false;
const $=id=>document.getElementById(id);
function speakWord(w){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function visibleWords(){return words.map((w,i)=>({...w,index:i})).filter(w=>group==='all'||w.group===group)}
function renderWords(){const grid=$('bodyWordGrid');grid.textContent='';const list=visibleWords();if(!list.length)return;if(current>=list.length)current=0;const item=list[current],w=words[item.index];const card=document.createElement('article');card.className='vocab-card';card.innerHTML='<div class="vocab-symbol" aria-hidden="true">'+w.emoji+'</div><div class="vocab-word">'+w.en+'</div><div class="vocab-meaning">'+w.ar+'</div><div class="vocab-pron">النطق التقريبي: '+w.pron+'</div><div class="hint" style="text-align:center">الكلمة '+(current+1)+' من '+list.length+'</div>';const listen=document.createElement('button');listen.className='btn';listen.textContent='🔊 اسمع النطق';listen.onclick=()=>{speakWord(w.en);learned.add(item.index);updateProgress()};card.appendChild(listen);grid.appendChild(card);$('bodyNextWord').textContent=current===list.length-1?'خلصت الكلمات ✓':'خلصت الكلمة — التالية ←';$('bodyNextWord').disabled=false}
function updateProgress(){$('bodyProgress').style.width=(learned.size/words.length*100)+'%';$('bodyLearnedLabel').textContent=learned.size+' من '+words.length+' كلمة اتعلّمتها'}
function newQuestion(){asked=Math.floor(Math.random()*words.length);answered=false;const options=new Set([asked]);while(options.size<4)options.add(Math.floor(Math.random()*words.length));const list=[...options].sort(()=>Math.random()-.5);$('bodyQuizFeedback').textContent='';$('bodyQuizOptions').textContent='';const w=words[asked];$('bodyQuizOptions').dataset.correct=String(asked);const q=document.createElement('div');q.style.gridColumn='1/-1';q.style.textAlign='center';q.style.fontSize='26px';q.style.fontWeight='900';q.style.direction='ltr';q.textContent=w.en;$('bodyQuizOptions').appendChild(q);list.forEach(i=>{const b=document.createElement('button');b.className='btn';b.textContent=words[i].ar;b.onclick=()=>{if(answered)return;answered=true;if(i===asked){b.style.background='#d9f7e8';b.style.borderColor='#087f70';$('bodyQuizFeedback').textContent='صح! '+w.en+' معناها '+w.ar+' 👏';$('bodyQuizFeedback').style.color='#087f70';learned.add(asked);updateProgress()}else{b.style.background='#fde8e5';b.style.borderColor='#b85a4a';$('bodyQuizFeedback').textContent='مش بالظبط. '+w.en+' معناها '+w.ar+'. جرّب السؤال اللي بعده.';$('bodyQuizFeedback').style.color='#a85b20';[...$('bodyQuizOptions').children].forEach(x=>{if(x.textContent===w.ar){x.style.background='#d9f7e8';x.style.borderColor='#087f70'}})}};$('bodyQuizOptions').appendChild(b)})}
$('bodyTabs').addEventListener('click',e=>{const b=e.target.closest('[data-body-group]');if(!b)return;group=b.dataset.bodyGroup;[...$('bodyTabs').querySelectorAll('button')].forEach(x=>x.classList.toggle('active',x===b));renderWords()});
$('bodyNextQuestion').onclick=newQuestion;$('bodyNextWord').onclick=()=>{const list=visibleWords();if(current<list.length-1){learned.add(list[current].index);updateProgress();current++;renderWords()}else{$('bodyNextWord').textContent='خلصت الكلمات كلها! 🎉';$('bodyNextWord').disabled=true;learned.add(list[current].index);updateProgress()}};$('bodyTabs').addEventListener('click',()=>{current=0;renderWords()});renderWords();updateProgress();newQuestion();
})();
</script></body></html>
